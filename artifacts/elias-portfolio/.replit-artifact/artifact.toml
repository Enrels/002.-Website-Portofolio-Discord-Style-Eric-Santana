kind = "web"
previewPath = "/"
title = "Elias Portfolio"
version = "1.0.0"
id = "artifacts/elias-portfolio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22606

[services.development]
run = "pnpm --filter @workspace/elias-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/elias-portfolio", "run", "build" ]
publicDir = "artifacts/elias-portfolio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22606"
BASE_PATH = "/"
